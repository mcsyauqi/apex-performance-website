<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Dumbbells -->
  <rect x="200" y="250" width="150" height="15" rx="5" fill="url(#accent)"/>
  <rect x="180" y="230" width="30" height="55" rx="5" fill="url(#accent)"/>
  <rect x="340" y="230" width="30" height="55" rx="5" fill="url(#accent)"/>
  <!-- Kettlebell -->
  <circle cx="550" cy="300" r="50" fill="url(#accent)"/>
  <ellipse cx="550" cy="230" rx="25" ry="20" fill="none" stroke="url(#accent)" stroke-width="12"/>
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">APEX PERFORMANCE</text>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6B7280">World-Class Fitness</text>
</svg>
